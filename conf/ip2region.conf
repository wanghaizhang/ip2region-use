worker_processes  1;
error_log  logs/error.log  warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # make lua/ip2region.lua findable via require("ip2region")
    lua_package_path "lua/ip2region.lua;";

    init_worker_by_lua_block {
        local ip2region = require("ip2region")
        local dbPath = "data/ip2region_v4.xdb"
        local verr = ip2region.verify(dbPath)
        if verr then
            ngx.log(ngx.ERR, "ip2region verify failed: ", verr)
        else
            local ok, err = ip2region.init(dbPath)
            if not ok then
                ngx.log(ngx.ERR, "ip2region init failed: ", err)
            end
        end
    }

    server {
        listen       8080;
        server_name  localhost;

        location = / {
            content_by_lua_block {
                ngx.header["Content-Type"] = "application/json; charset=utf-8"
                ngx.say([[{"success":true,"service":"ip2region-lua","endpoints":["/ip2region/api/ip","/ip2region/api/ip/{IP}"]}]])
            }
        }

        # GET /ip2region/api/ip  -> look up the client IP
        location = /ip2region/api/ip {
            content_by_lua_block {
                local ip2region = require("ip2region")
                local ip = ngx.var.remote_addr
                -- strip IPv6-mapped IPv4 prefix ::ffff:1.2.3.4
                local plain = ip:match("::ffff:(.+)") or ip
                handle_query(ip2region, plain)
            }
        }

        # GET /ip2region/api/ip/8.8.8.8
        location ~ ^/ip2region/api/ip/(.+)$ {
            content_by_lua_block {
                local ip2region = require("ip2region")
                local ip = ngx.var[1]
                handle_query(ip2region, ip)
            }
        }
    }
}

