# ============================================================================
# image-service.conf — OpenResty image processing service
# ============================================================================
# Include this file from your main nginx.conf (http {} block). It runs on its
# own server block so it does NOT disturb the existing ip2region service.
#
#   include conf/image-service.conf;
#
# Ports: change `listen` below to your preference. imgproxy_host / imgproxy_port
# in lua/image_service/config.lua must match where imgproxy is reachable.
#
# Requires an nginx shared dict (place ONCE in the http {} block, before this
# file's server block):
#   shared_zone image_rate 5m;
# ============================================================================

# ---- shared dict for rate limiting (idempotent: only add if missing) --------
# Uncomment the line below once, in the http {} block.
# shared_zone image_rate 5m;

server {
    listen       8090;
    server_name  _;

    # ---- shared settings ----------------------------------------------------
    # lua_package_path is set once in the main nginx.conf http block (points at
    # openresty/lua/image_service). Do NOT duplicate it here — it is not allowed
    # in server context.

    # ---- request body cap (MiB) ---------------------------------------------
    client_max_body_size 20m;

    # ---- internal temp source location --------------------------------------
    # imgproxy fetches decoded base64 / uploaded images from here. It is `internal`
    # so it is NOT publicly routable. In Docker this must be reachable from the
    # imgproxy network (set the internal_base host accordingly in config.lua).
    location /__imgsrv_tmp/ {
        alias  tmp/imgsrv/;
        internal;
        # do not cache temp source files (they are per-request tokens)
        add_header Cache-Control "no-store";
        # allow imgproxy to fetch
        access_log off;
    }

    # ---- API routes ---------------------------------------------------------
    location /api/v1/ {
        # rate limiting via limit_req (leaky bucket). Requires limit_req_zone in
        # the http {} block (see below). Comment out to disable at nginx level
        # (Lua-level limiting in security.lua still applies).
        # limit_req zone=image_rate burst=20 nodelay;

        content_by_lua_block {
            require("image_service.image_api").route()
        }
    }

    # ---- crypto probe (temporary) -------------------------------------------
    location = /api/v1/probe {
        content_by_lua_block {
            require("image_service.testngx")
        }
    }

    # ---- print forwarded imgproxy URL ---------------------------------------
    location = /api/v1/printurl {
        content_by_lua_block {
            require("image_service.printurl")
        }
    }

    # ---- health check -------------------------------------------------------
    location = /api/v1/health {
        content_by_lua_block {
            ngx.header["Content-Type"] = "application/json; charset=utf-8"
            ngx.say('{"success":true,"service":"image-service"}')
        }
    }

    # ---- error log ----------------------------------------------------------
    error_log  logs/image-service.error.log  warn;
    access_log logs/image-service.access.log;
}

# ----------------------------------------------------------------------------
# Required http {} directives (add these to the main nginx.conf http block if
# not already present). Do NOT duplicate lua_package_path twice.
#
#   # rate limiting zone (burst=20, 5 req/s per IP)
#   limit_req_zone $remote_addr zone=image_rate:5m rate=5r/s;
#
#   # image response cache (disk)
#   proxy_cache_path image_service_cache levels=1:2 keys_zone=image_cache:100m
#       max_size=10g inactive=30d use_temp_path=off;
# ----------------------------------------------------------------------------
