worker_processes  1;
error_log  logs/error.log  warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 关键：? 通配模块名，;; 保留 Lua 默认搜索路径。
    # lualib 必须排在最前：ngx_lua 内置的 resty.* / ngx.* 都在 lualib/ 下，
    # 缺了 ./lualib/?.lua 则 worker 启动时 require "resty.core" 失败。
    # 原写法 "lua/ip2region.lua;lua/ip2region_api.lua;" 会让请求失败。
    lua_package_path "./lualib/?.lua;./lua/?.lua;./lua/image_service/?.lua;;";

    # image-service: OpenResty image processing (Lua entry + imgproxy engine)
    # 独立 server 块，监听 8090，与 ip2region(8080) 互不干扰
    include image-service.conf;

    init_worker_by_lua_block {
        local ip2region = require("ip2region")
        local dbPath = "data/ip2region_v4.xdb"
        local verr = ip2region.verify(dbPath)
        if verr then
            ngx.log(ngx.ERR, "ip2region verify failed: ", verr)
        else
            local ok, err = ip2region.init(dbPath)
            if not ok then
                ngx.log(ngx.ERR, "ip2region init failed: ", err)
            else
                ngx.log(ngx.WARN, "ip2region loaded OK: ", dbPath)
            end
        end
    }

    server {
        listen       8080;
        server_name  localhost;

        location = / {
            content_by_lua_block {
                local api = require("ip2region_api")
                api.send("", "", nil)
            }
        }

        location = /ip2region/api/ip {
            content_by_lua_block {
                local ip2region = require("ip2region")
                local api = require("ip2region_api")
                local ip = ngx.var.remote_addr
                local plain = ip:match("::ffff:(.+)") or ip
                local region, err = ip2region.query(plain)
                api.send(plain, region, err)
            }
        }

        location ~ ^/ip2region/api/ip/(?<query_ip>.+)$ {
            content_by_lua_block {
                local ip2region = require("ip2region")
                local api = require("ip2region_api")
                local ip = ngx.var.query_ip
                local region, err = ip2region.query(ip)
                api.send(ip, region, err)
            }
        }
    }
}
